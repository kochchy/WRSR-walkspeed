; walkspeed - modifies movement speed and travel time limits for citizens. UTF-8 without BOM.
;
; Loaded by plugins\walkspeed.dll via TesmioLoader.
; Deleting or disabling the DLL restores default game behavior.
; Does not alter save file formats.

[walkspeed]

; 0 = plugin is disabled (game runs in original state)
; 1 = plugin is active
enabled = 1

; Citizen walk speed multiplier (float).
; Default in-game value: 1.0 (standard game speed)
; 1.25 = 25% faster walking
; 1.5 = 50% faster walking
; 2.0 = double walking speed
; 0.75 = slower walking
multiplier = 1.0

; Maximum station waiting time multiplier (float).
; Scales how long citizens can wait at bus stops, train stations, passenger harbors, etc.
; (vanilla ~1 game hour = 600.0s) before giving up and returning home.
; Default in-game value: 1.0
; 1.5 = 50% longer waiting time (900s)
; 2.0 = double waiting time (1200s)
station_timeout_multiplier = 1.0

; Maximum vehicle travel time multiplier (float).
; Scales how long citizens can travel inside vehicles like buses, trains, trolleybuses,
; trams, helicopters, passenger ships, and cars (vanilla ~4-5 hours = 380.0s)
; before timing out and returning home. Does NOT affect or shorten working hours!
; Default in-game value: 1.0
; 1.5 = 50% longer travel time (570s)
; 2.0 = double travel time (760s)
vehicle_timeout_multiplier = 1.0
