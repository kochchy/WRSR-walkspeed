; walkspeed - modifies movement speed and travel time limit for citizens. UTF-8 without BOM.
;
; Loaded by plugins\walkspeed.dll via TesmioLoader.
; Deleting or disabling the DLL restores default game behavior.
; Does not alter save file formats.

[walkspeed]

; 0 = plugin is disabled (game runs in original state)
; 1 = plugin is active
enabled = 1

; Citizen walk speed multiplier (float).
; Default in-game value: 1.0 (standard game speed)
; 1.25 = 25% faster walking
; 1.5 = 50% faster walking
; 2.0 = double walking speed
; 0.75 = slower walking
multiplier = 1.0

; Maximum travel / waiting time multiplier (experimental timer dampening).
; Default in-game value: 1.0 (original game behavior, no dampening)
; 1.5 = 50% more travel time
; 2.0 = 2x travel time
travel_timeout_multiplier = 1.0
