; walkspeed - modifies movement speed and travel time limit for citizens. UTF-8 without BOM.
;
; Loaded by plugins\walkspeed.dll via TesmioLoader.
; Deleting or disabling the DLL restores default game behavior.
; Does not alter save file formats.

[walkspeed]

; 0 = plugin is disabled (game runs in original state)
; 1 = plugin is active
enabled = 1

; Citizen walk speed multiplier (float).
; Default in-game value: 1.0 (standard game speed)
; 1.25 = 25% faster walking
; 1.5 = 50% faster walking
; 2.0 = double walking speed
; 0.75 = slower walking
multiplier = 1.0

; Maximum waiting and travel time multiplier (float).
; Scales how long citizens can wait at bus stops / stations (vanilla ~1 hour)
; and travel inside vehicles like buses, trains, and cars (vanilla ~4-5 hours)
; before timing out and returning home. Does NOT affect or shorten working hours!
; Default in-game value: 1.0 (standard game limits: 600s station, 380s vehicle)
; 1.5 = 50% longer waiting and travel time allowed
; 2.0 = 2x longer waiting and travel time allowed
travel_timeout_multiplier = 1.0
